    function potongNama(nama) {
        let words = nama.trim().split(' ');
        
        
        if (words.length < 3) {
            return nama;
        }
        
        let hasil = words.slice(0, 2).join(' ');
        
        for (let i = 2; i < words.length; i++) {
            hasil += ' ' + words[i][0].toUpperCase() + '.';
        }
        
        return hasil;
    }

    function cekPembagi(angka) {
        let pembagi = [];
        
        for (let i = 1; i <= 5; i++) {
            if (angka % i === 0) {
                pembagi.push(i);
            }
        }
        
        return pembagi.join(',');
    }

    //NO.8
    function cariKataTerSedikit(menu) {
        let minWords = Infinity;
        let itemTerSedikit = "";
        
        for (let item of menu) {
            let jumlahKata = item.split(' ').length;
            if (jumlahKata < minWords) {
                minWords = jumlahKata;
                itemTerSedikit = item;
            }
        }
        
        return {
            jumlah: minWords,
            item: itemTerSedikit
        };
    }
